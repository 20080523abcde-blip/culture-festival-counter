<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>収穫祭 来場者数カウンター</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><header class="topbar"><a class="brand" href="index.html">収穫祭カウンター</a><a href="display.html">表示ページ →</a></header><section class="card counter-card"><p class="eyebrow">VISITOR COUNTER</p><h1>来場者数</h1><p id="status" class="status" role="status">接続しています…</p><output id="count" class="count" aria-live="polite">—</output><p class="unit">人</p><div id="login-panel"><p>カウント係は管理者アカウントでログインしてください。</p><form id="login-form"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button class="button secondary">ログイン</button></form></div><div id="counter-panel" hidden><p id="signed-in"></p><button id="increment" class="button primary" disabled>＋1人</button><div class="actions"><button id="reset" class="button danger">人数をリセット</button><button id="logout" class="button secondary">ログアウト</button></div></div><p id="error" class="error" role="alert" hidden></p></section></main><script type="module" src="counter.js"></script></body></html>
